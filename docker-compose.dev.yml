# Frontend Development - Backend built from local source
#
# Usage:
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. make dev-web
#   3. Open http://localhost:5173 (Rsbuild dev server, API auto-proxied to :3000)
#
# Rebuild backend after Go code changes:
#   docker compose -f docker-compose.dev.yml up -d --build new-api
#
# Stop:
#   docker compose -f docker-compose.dev.yml down
#
# Reset data:
#   docker compose -f docker-compose.dev.yml down -v

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: new-api-dev:local
    container_name: new-api-dev
    restart: unless-stopped
    ports:
      - "3456:3000"  # TEMP: :3000 held by stale phy-sci dev server; revert to "3000:3000" after testing
    volumes:
      - dev_data:/data
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - BATCH_UPDATE_ENABLED=true
      # ------------------------------------------------------------------
      # 本地测试：禁用登录/全局限流，避免 429 干扰。
      #
      # 速率限制由这些环境变量控制（common/init.go 启动时读取，改后需重建容器）：
      #   CRITICAL_RATE_LIMIT_ENABLE / CRITICAL_RATE_LIMIT / CRITICAL_RATE_LIMIT_DURATION
      #     -> 登录等关键接口：默认 true / 20 次 / 1200 秒
      #   GLOBAL_API_RATE_LIMIT_ENABLE / GLOBAL_API_RATE_LIMIT / GLOBAL_API_RATE_LIMIT_DURATION
      #     -> 全局 /api：默认 true / 360 次 / 180 秒
      #   GLOBAL_WEB_RATE_LIMIT_ENABLE / GLOBAL_WEB_RATE_LIMIT / GLOBAL_WEB_RATE_LIMIT_DURATION
      #     -> Web 静态资源：默认 true / 120 次 / 180 秒
      #
      # 想「调大」而非禁用：把 *_ENABLE 留 true，调大 *_LIMIT（次数）与 *_LIMIT_DURATION（秒）。
      # 想恢复默认（生产建议）：删除下面三行 *_ENABLE=false，再 `docker compose up -d`。
      # ------------------------------------------------------------------
      - CRITICAL_RATE_LIMIT_ENABLE=false
      - GLOBAL_API_RATE_LIMIT_ENABLE=false
      - GLOBAL_WEB_RATE_LIMIT_ENABLE=false
      # Local HTTP dev mode: keep Secure=false and leave TRUSTED_URL unset. This disables the refresh/logout OriginGuard so the :5173 -> :3000 dev proxy works.
      - SESSION_COOKIE_SECURE=false
      # For HTTPS only: set Secure=true and list every exact trusted HTTPS browser Origin. This does not configure relay CORS.
      # - SESSION_COOKIE_SECURE=true
      # - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: new-api-dev-redis
    restart: unless-stopped
    networks:
      - dev-network

  postgres:
    image: postgres:15-alpine
    container_name: new-api-dev-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dev_data:
  dev_pg_data:

networks:
  dev-network:
    driver: bridge
